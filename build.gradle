plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def mcVersion = providers.gradleProperty('mc_version').orElse('1.21.4').get()
def mcVersions = [
    '1.21.4':  [minecraft: '1.21.4',  loader: '0.19.3', fabricApi: '0.119.4+1.21.4'],
    '1.21.11': [minecraft: '1.21.11', loader: '0.19.3', fabricApi: '0.141.6+1.21.11'],
]
def mcProps = mcVersions[mcVersion]
if (mcProps == null) {
    throw new GradleException("Unsupported mc_version '${mcVersion}'. Supported: ${mcVersions.keySet()}")
}
ext.minecraft_version = mcProps.minecraft
ext.loader_version = mcProps.loader
ext.fabric_api_version = mcProps.fabricApi

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "pythemcio" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java {
            srcDir "src/versions/${mcVersion}/main/java"
        }
    }
    client {
        java {
            srcDir "src/versions/${mcVersion}/client/java"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
